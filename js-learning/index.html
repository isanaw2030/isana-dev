<!DOCTYPE html>
<html>
<head><title>ISANA Shop - Day 7</title>
<style>
body{font-family:Arial;padding:20px;display:flex;gap:20px}
#shop{flex:2}
#cart{flex:1;border:2px solid #000;padding:15px;position:sticky;top:20px;height:fit-content}
.product{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px}
.out{opacity:0.5}
button{background:black;color:white;padding:8px 15px;border:none;border-radius:5px;cursor:pointer}
</style>
</head>
<body>
<div id="shop"></div>
<div id="cart">
  <h2>Cart (<span id="cart-count">0</span>)</h2>
  <div id="cart-items"></div>
  <h3>Total: KES <span id="cart-total">0</span></h3>
  <button onclick="checkout()" style="width:100%;background:green">Checkout - M-Pesa</button>
  <button onclick="cart=[];renderCart()" style="width:100%;background:#ccc;color:#000;margin-top:5px">Clear Cart</button>
</div>
<script src="07-pro-cart.js"></script>
</body>
</html>
