<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISANA. BAHATI - Shop</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-black text-white p-4 flex justify-between items-center sticky top-0 z-10">
  <h1 class="font-bold text-xl tracking-widest">ISANA. BAHATI</h1>
  <div>
    <button onclick="openAdmin()" class="mr-4 text-sm underline">Admin</button>
    <button onclick="openCart()" class="bg-white text-black px-4 py-1 rounded-full">Cart (<span id="cart-count">0</span>)</button>
  </div>
</header>
<div class="p-4 flex gap-2 overflow-auto">
  <button onclick="filterCat('All')" class="px-4 py-1 bg-black text-white rounded-full text-sm">All</button>
  <button onclick="filterCat('Jogger')" class="px-4 py-1 bg-white border rounded-full text-sm">Jogger</button>
  <button onclick="filterCat('Shirt')" class="px-4 py-1 bg-white border rounded-full text-sm">Shirt</button>
  <button onclick="filterCat('Dress')" class="px-4 py-1 bg-white border rounded-full text-sm">Dress</button>
</div>
<main id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4"></main>
<div id="cart-modal" class="hidden fixed inset-0 bg-black/50 z-20 flex justify-end">
  <div class="bg-white w-full max-w-sm h-full p-6 overflow-auto">
    <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Your Cart</h2><button onclick="closeCart()" class="text-2xl">&times;</button></div>
    <div id="cart-items"></div>
    <div class="mt-6 border-t pt-4"><p class="font-bold text-lg">Total: KES <span id="cart-total">0</span></p><button onclick="checkout()" class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-bold">Checkout with M-Pesa</button></div>
  </div>
</div>
<div id="admin-modal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md p-6 rounded-lg">
    <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Shop Admin</h2><button onclick="closeAdmin()" class="text-2xl">&times;</button></div>
    <div id="admin-login"><input id="admin-pass" type="password" placeholder="Enter admin password" class="w-full border p-2 rounded mb-2"><button onclick="loginAdmin()" class="w-full bg-black text-white py-2 rounded">Login</button></div>
    <div id="admin-panel" class="hidden">
      <p class="text-sm text-green-600 mb-3">Logged in.</p>
      <input id="p-name" placeholder="Product Name" class="w-full border p-2 rounded mb-2">
      <input id="p-price" type="number" placeholder="Price (KES)" class="w-full border p-2 rounded mb-2">
      <input id="p-image" placeholder="Image URL" class="w-full border p-2 rounded mb-2">
      <input id="p-category" placeholder="Category" class="w-full border p-2 rounded mb-2">
      <input id="p-stock" type="number" placeholder="Stock" class="w-full border p-2 rounded mb-2">
      <button onclick="addProduct()" class="w-full bg-black text-white py-2 rounded">Add Product</button>
      <hr class="my-4"><div id="admin-list" class="space-y-2 text-sm"></div>
    </div>
  </div>
</div>
<script src="shop.js"></script>
</body>
</html>
